[project]
name = "nestro-backend"
version = "0.1.0"
description = "FastAPI backend for Nestro — PG management and resident experience platform."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "pyjwt>=2.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
